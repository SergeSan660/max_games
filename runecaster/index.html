<!doctype html><meta charset="utf-8"><title>Rune//Caster loading…</title><body style="margin:0;background:#0f1020;color:#fff;font-family:system-ui"><p style="padding:24px">Loading Rune//Caster…</p><script>(async()=>{try{const ps=[1,2,3,4,5,6].map(i=>`snapshot/part${i}.txt`);const rs=await Promise.all(ps.map(async p=>{const r=await fetch(p);if(!r.ok)throw new Error(`${p}: HTTP ${r.status}`);return r.text()}));document.open();document.write(rs.join(''));document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px">Failed to load Rune//Caster\n'+String(e)+'</pre>'}})();</script>
