name: RuneCaster smoke

on:
  push:
    paths:
      - 'runecaster/**'
      - '.github/workflows/runecaster-smoke.yml'
  pull_request:
    paths:
      - 'runecaster/**'
      - '.github/workflows/runecaster-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify imported browser snapshot
        run: python runecaster/verify_snapshot.py
      - name: Verify static playable entry points
        run: |
          test -s index.html
          test -s runecaster/index.html
          test -s runecaster/play.html
          grep -q 'patches/v0.9.3.js' runecaster/index.html
          grep -q 'patches/v0.9.3.js' runecaster/play.html
      - name: Verify runtime patch syntax and pathfinding markers
        run: |
          node --check runecaster/patches/v0.9.3.js
          grep -q 'findPath' runecaster/patches/v0.9.3.js
          grep -q 'Diagonal movement' runecaster/patches/v0.9.3.js
          grep -q 'segmentClear' runecaster/patches/v0.9.3.js
          grep -q 'smoothPath' runecaster/patches/v0.9.3.js
          grep -q 'bestReachable' runecaster/patches/v0.9.3.js
          grep -q 'RuneCasterNav' runecaster/patches/v0.9.3.js
      - name: Package playable RuneCaster
        run: |
          mkdir -p dist/RuneCaster-v0.9.3
          cp -R runecaster/. dist/RuneCaster-v0.9.3/
          cat > dist/RuneCaster-v0.9.3/START_HERE.txt <<'EOF'
          Rune//Caster v0.9.3

          Because browsers block fetch() from file:// URLs, run this folder through a tiny local HTTP server.

          macOS / Linux:
            cd RuneCaster-v0.9.3
            python3 -m http.server 8000

          Windows:
            cd RuneCaster-v0.9.3
            py -m http.server 8000

          Then open:
            http://localhost:8000/play.html
          EOF
      - name: Upload playable RuneCaster
        uses: actions/upload-artifact@v4
        with:
          name: RuneCaster-v0.9.3
          path: dist/RuneCaster-v0.9.3
          if-no-files-found: error
