name: RuneCaster smoke

on:
  push:
    paths:
      - 'runecaster/**'
      - '.github/workflows/runecaster-smoke.yml'
  pull_request:
    paths:
      - 'runecaster/**'
      - '.github/workflows/runecaster-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify imported browser snapshot
        run: python runecaster/verify_snapshot.py
      - name: Verify static playable entry points
        run: |
          test -s index.html
          test -s runecaster/index.html
          test -s runecaster/play.html
          grep -q 'patches/v0.9.2.js' runecaster/index.html
          grep -q 'patches/v0.9.2.js' runecaster/play.html
      - name: Verify runtime patch syntax and pathfinding markers
        run: |
          node --check runecaster/patches/v0.9.2.js
          grep -q 'findPath' runecaster/patches/v0.9.2.js
          grep -q 'no corner' runecaster/patches/v0.9.2.js
          grep -q 'RuneCasterNav' runecaster/patches/v0.9.2.js
