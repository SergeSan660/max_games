name: RuneCaster smoke

on:
  push:
    paths:
      - 'runecaster/**'
      - '.github/workflows/runecaster-smoke.yml'
  pull_request:
    paths:
      - 'runecaster/**'
      - '.github/workflows/runecaster-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify imported browser snapshot
        run: python runecaster/verify_snapshot.py
      - name: Verify static playable entry points
        run: |
          test -s index.html
          test -s runecaster/index.html
          test -s runecaster/play.html
          grep -q 'patches/v0.9.3.js' runecaster/index.html
          grep -q 'patches/v0.9.4.js' runecaster/index.html
          grep -q 'patches/v0.9.5.js' runecaster/index.html
          grep -q 'patches/v0.9.6.js' runecaster/index.html
          grep -q 'patches/v0.9.7.js' runecaster/index.html
          grep -q 'patches/v0.9.3.js' runecaster/play.html
          grep -q 'patches/v0.9.4.js' runecaster/play.html
          grep -q 'patches/v0.9.5.js' runecaster/play.html
          grep -q 'patches/v0.9.6.js' runecaster/play.html
          grep -q 'patches/v0.9.7.js' runecaster/play.html
      - name: Verify runtime patch syntax and pathfinding markers
        run: |
          node --check runecaster/patches/v0.9.3.js
          node --check runecaster/patches/v0.9.4.js
          node --check runecaster/patches/v0.9.5.js
          node --check runecaster/patches/v0.9.6.js
          node --check runecaster/patches/v0.9.7.js
          grep -q 'findPath' runecaster/patches/v0.9.3.js
          grep -q 'RuneCasterNav' runecaster/patches/v0.9.3.js
      - name: Verify cooldown and cast-chain rules
        run: |
          grep -q '10 potential damage = 1 second cooldown' runecaster/patches/v0.9.5.js
          grep -q 'chain("Spell Name")' runecaster/patches/v0.9.5.js
          grep -q 'mana fully bypassed' runecaster/patches/v0.9.7.js
          grep -q 'cooldownSeconds' runecaster/patches/v0.9.7.js
