name: RuneCaster smoke

on:
  push:
    paths:
      - 'runecaster/**'
      - '.github/workflows/runecaster-smoke.yml'
  pull_request:
    paths:
      - 'runecaster/**'
      - '.github/workflows/runecaster-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify imported browser snapshot
        run: python runecaster/verify_snapshot.py
      - name: Verify static entry points
        run: |
          test -s index.html
          test -s runecaster/index.html
